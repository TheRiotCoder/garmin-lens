<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garmin Lens – private insights from your Garmin data</title>
<meta name="description" content="Privacy-first charts and deeper insights from your Garmin data export: recovery, HRV and resting-HR baselines, sleep consistency, training load, correlations. Runs entirely in your browser, works offline.">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garmin Lens">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1 id="title">Garmin Lens</h1>
  <button id="themeBtn" class="hb" type="button" aria-label="Switch light / dark theme" title="Light / dark">🌓</button>
</header>
<div id="demo-bar" class="demo-bar" role="status" hidden><b>DEMO DATA</b> <span>Synthetic – not real health data.</span> <button id="demo-clear" type="button">Remove demo</button></div>
<div id="update-bar" class="update" hidden>A new version is ready. <button id="update-btn" class="btn primary" type="button">Update</button></div>
<main id="app"><noscript>Garmin Lens needs JavaScript. Nothing is sent anywhere.</noscript></main>
<nav id="tabs" class="tabs" aria-label="Sections"></nav>
<div id="install-banner" class="install" hidden>
  <img src="icons/icon-192.png" alt="" width="40" height="40">
  <div class="it"><b>Install Garmin Lens</b><span>Add it to your home screen – works offline.</span></div>
  <button id="install-btn" class="btn primary" type="button">Install</button>
  <button id="install-dismiss" class="hb" type="button" aria-label="Dismiss">✕</button>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="js/dates.js"></script>
<script src="js/stats.js"></script>
<script src="js/zip.js"></script>
<script src="js/fit.js"></script>
<script src="js/parsers.js"></script>
<script src="js/importer.js"></script>
<script src="js/crypto.js"></script>
<script src="js/db.js"></script>
<script src="js/demo.js"></script>
<script src="js/models.js"></script>
<script src="js/insights.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/views.js"></script>
<script src="js/data-view.js"></script>
</body>
</html>
